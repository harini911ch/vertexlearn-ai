services:

  postgres:
    image: postgres:17
    container_name: vertexlearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vertexlearn
      POSTGRES_PASSWORD: vertexlearn_dev
      POSTGRES_DB: vertexlearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vertexlearn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: